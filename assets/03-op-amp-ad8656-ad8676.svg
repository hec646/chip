<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1080" width="1080" height="1080">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="50%" stop-color="#fde047"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
  </defs>
  <rect width="1080" height="1080" fill="url(#bgGrad)"/>
  <rect x="36" y="36" width="1008" height="1008" rx="24" fill="none" stroke="url(#goldGrad)" stroke-width="6"/>

  <!-- Top Tag -->
  <rect x="290" y="76" width="500" height="58" rx="29" fill="#f59e0b" fill-opacity="0.2" stroke="#fde047" stroke-width="2"/>
  <text x="540" y="116" text-anchor="middle" fill="#fde047" font-family="Microsoft JhengHei, sans-serif" font-size="30" font-weight="bold">03-主要功能及規格｜精密運算放大器 IC</text>

  <!-- Main Title -->
  <text x="540" y="210" text-anchor="middle" fill="#ffffff" font-family="Microsoft JhengHei, sans-serif" font-size="64" font-weight="bold">ADI AD8656 / AD8676</text>
  <text x="540" y="280" text-anchor="middle" fill="#38bdf8" font-family="Microsoft JhengHei, sans-serif" font-size="44" font-weight="bold">高精度・超低雜訊雙運算放大器 (SOP-8)</text>

  <!-- Realistic IC Chip Illustration -->
  <g transform="translate(340, 330)">
    <!-- Pins Left & Right -->
    <rect x="-40" y="40" width="50" height="22" rx="4" fill="#cbd5e1"/>
    <rect x="-40" y="95" width="50" height="22" rx="4" fill="#cbd5e1"/>
    <rect x="-40" y="150" width="50" height="22" rx="4" fill="#cbd5e1"/>
    <rect x="-40" y="205" width="50" height="22" rx="4" fill="#cbd5e1"/>
    <rect x="390" y="40" width="50" height="22" rx="4" fill="#cbd5e1"/>
    <rect x="390" y="95" width="50" height="22" rx="4" fill="#cbd5e1"/>
    <rect x="390" y="150" width="50" height="22" rx="4" fill="#cbd5e1"/>
    <rect x="390" y="205" width="50" height="22" rx="4" fill="#cbd5e1"/>
    <!-- IC Body -->
    <rect x="0" y="10" width="400" height="250" rx="16" fill="#111827" stroke="#475569" stroke-width="4"/>
    <circle cx="45" cy="55" r="14" fill="#334155"/>
    <text x="200" y="115" text-anchor="middle" fill="#f8fafc" font-family="Consolas, monospace" font-size="44" font-weight="bold">AD8656 / AD8676</text>
    <text x="200" y="170" text-anchor="middle" fill="#fde047" font-family="Consolas, monospace" font-size="30" font-weight="bold">ANALOG DEVICES</text>
    <text x="200" y="218" text-anchor="middle" fill="#94a3b8" font-family="Microsoft JhengHei, sans-serif" font-size="24">PRECISION DUAL OP-AMP SOP-8</text>
  </g>

  <!-- Key Specs Box -->
  <rect x="80" y="635" width="920" height="240" rx="18" fill="#1e293b" stroke="#38bdf8" stroke-width="3"/>
  <text x="540" y="695" text-anchor="middle" fill="#fde047" font-family="Microsoft JhengHei, sans-serif" font-size="38" font-weight="bold">✔ 超低失真・軌對軌輸入輸出・高開環增益穩定</text>
  <text x="540" y="758" text-anchor="middle" fill="#f8fafc" font-family="Microsoft JhengHei, sans-serif" font-size="34" font-weight="bold">✔ 適用：高階音響 DAC 前級放大 / 精密儀表 / 感測器前端</text>
  <text x="540" y="825" text-anchor="middle" fill="#38bdf8" font-family="Microsoft JhengHei, sans-serif" font-size="36" font-weight="bold">蝦皮同步現貨｜AD8656: NT$65 (80顆)｜AD8676: NT$120 (60顆)</text>

  <!-- Bottom Banner -->
  <rect x="80" y="905" width="920" height="90" rx="14" fill="url(#goldGrad)"/>
  <text x="540" y="963" text-anchor="middle" fill="#0f172a" font-family="Microsoft JhengHei, sans-serif" font-size="38" font-weight="bold">全新現貨・腳位精準・蝦皮/Yahoo/露天/GitHub 同步供應</text>
</svg>
